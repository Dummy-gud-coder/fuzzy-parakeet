| --- |\n| **Developer** | Unknown Worlds Entertainment |\n| **Publisher** | Krafton |\n| **Genre** | Open-World Survival Craft |\n| **Co-op Support** | 1 to 4 players |\n| **Engine** | Unreal Engine 5 |\n| **Playtime Evaluated** | 42.5 hours |\n| **Performance Target** | 4K @ 60 FPS / 1440p @ 120 FPS |\n| **Overall Score** | 8.8 / 10 |\n\n---\n\n## Technical Metrics \u0026 Performance\n\n| Parameter | Measured Value | Target Baseline |\n| --- | --- | --- |\n| **Average Frame Rate (1440p High)** | 114 FPS | 120 FPS |\n| **1% Low Frame Rate** | 78 FPS | 60 FPS |\n| **Peak VRAM Usage** | 10.2 GB | 12 GB |\n| **World Load Time (NVMe Gen4)** | 4.8 seconds | \u003c 10.0 seconds |\n\n---\n\n## Key Systems \u0026 Gameplay Breakdown\n\n### 1. Cooperative Integration\n\nCo-op supports up to 4 players concurrently. Biome ecosystem pressure and resource consumption rates scale quantitatively based on group size:\n\n* **Resource Node Scaling**: Resource node yields increase by **25%** per additional player, preventing progression bottlenecks.\n* **World Limits**: No distance-tethering is enforced; individual players can inhabit separate biomes across the **16 km²** map footprint independently.\n* **Base Logistics**: Shared habitat power grids distribute energy consumption across connected modules at a baseline rate of **1.5 kW/s** per active fabricator.\n\n### 2. Vertical Depth Progression\n\nDepth progression is segmented into distinct pressure thresholds:\n\n* **Surface Tiers (0m – 150m)**: High ambient light; standard oxygen consumption ($1.0\times$ base rate).\n* **Mesopelagic Tiers (150m – 500m)**: Ambient light drops below **10%**; requires Hull Module Mk1 to prevent crush damage.\n* **Bathypelagic Tiers (500m – 1,200m+)**: Zero natural light; oxygen depletion accelerates to $2.2\times$ base rate without specialized rebreather equipment.\n\n---\n\n## Feature Matrix\n\n### Pros \u0026 Cons\n\n#### Strengths\n\n* [x] Volumetric water rendering increases underwater visual range by **40%** compared to previous series entries.\n* [x] Multi-player synchronization maintains a stable **60 Hz** tick rate during intense creature interactions.\n* [x] Vehicle modularity expands to 12 distinct upgrade slots per submersible.\n\n#### Limitations\n\n* [ ] Fauna collision behavior in subterranean cave geometry exhibits pathfinding clipping at speeds exceeding **25 m/s**.\n* [ ] Base power routing requires manual node resetting when structural module counts exceed 50 units in a single grid.\n\n---\n\n## Final Verdict\n\nSubnautica 2 delivers structural improvements to the survival-crafting loop, combining stable 4-player cooperative play with high-fidelity visual rendering and deep environmental scaling.\n\n**Final Score: 8.8 / 10**\n"])</script><script>self.__next_f.push([1,"f:[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L12\",null,{\"games\":[{\"id\":\"terraforming-mars\",\"title\":\"Terraforming Mars\",\"platform\":\"PC / Epic\",\"status\":\"Planned\",\"tags\":[\"simulator\",\"strategy\",\"co-operative\",\"multiplayer\",\"single-player\"],\"coverUrl\":\"/covers/terraforming-mars.webp\",\"uri\":\"https://store.steampowered.com/app/800270\"},{\"id\":\"nocturnal\",\"title\":\"Nocturnal\",\"platform\":\"PC / Steam\",\"status\":\"Backlog\",\"tags\":[\"adventure\",\"platform\",\"single-player\"],\"coverUrl\":\"/covers/nocturnal.webp\",\"uri\":\"https://store.steampowered.com/app/1634080/Nocturnal\"},{\"id\":\"symmetry\",\"title\":\"SYMMETRY\",\"platform\":\"PC / GOG\",\"status\":\"Planned\",\"tags\":[\"adventure\",\"indie\",\"simulator\",\"strategy\",\"single-player\"],\"coverUrl\":\"/covers/symmetry.webp\",\"uri\":\"https://store.steampowered.com/app/537520\"},{\"id\":\"tomb-raider-underworld\",\"title\":\"Tomb Raider: Underworld\",\"platform\":\"PC / Steam\",\"status\":\"Planned\",\"tags\":[\"adventure\",\"platform\",\"shooter\",\"single-player\"],\"coverUrl\":\"/covers/tomb-raider-underworld.webp\",\"uri\":\"https://store.steampowered.com/app/8140\"}
